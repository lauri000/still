name: Still
options:
  bundleIdPrefix: com.stillreader
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Still:
    type: application
    platform: iOS
    sources: [Still]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillreader.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Still
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StillMac:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources: [Still]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillreader.mac
        PRODUCT_NAME: Still
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Still
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        CODE_SIGN_ENTITLEMENTS: Still/StillMac.entitlements
  StillTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StillTests]
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StillUITests]
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Still:
    build:
      targets:
        Still: all
    test:
      targets: [StillTests, StillUITests]
  StillMac:
    build:
      targets:
        StillMac: all
