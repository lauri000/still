name: Still
options:
  bundleIdPrefix: com.stillreader
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Still:
    type: application
    platform: iOS
    sources: [shared, ios]
    configFiles:
      Debug: ios/Config.xcconfig
      Release: ios/Config.xcconfig
  StillMac:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources: [shared, macos]
    configFiles:
      Debug: macos/Config.xcconfig
      Release: macos/Config.xcconfig
  StillTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/StillTests]
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/StillUITests]
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Still:
    build:
      targets:
        Still: all
    test:
      targets: [StillTests, StillUITests]
  StillMac:
    build:
      targets:
        StillMac: all
