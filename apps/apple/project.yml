name: Still
options:
  bundleIdPrefix: com.stillreader
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Still:
    type: application
    platform: iOS
    sources:
      - shared
      - ios
      - ../../shared/resources
      - path: ../../shared/fixtures/sample.pdf
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    configFiles:
      Debug: ios/Config.xcconfig
      Release: ios/Config.xcconfig
  StillMac:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - shared
      - macos
      - ../../shared/resources
      - path: ../../shared/fixtures/sample.pdf
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    configFiles:
      Debug: macos/Config.xcconfig
      Release: macos/Config.xcconfig
  StillTests:
    preBuildScripts:
      - name: Generate EPUB test fixtures
        script: python3 "$SRCROOT/../../scripts/epub-fixtures.py"
        inputFiles:
          - $(SRCROOT)/../../scripts/epub-fixtures.py
        outputFiles:
          - $(SRCROOT)/../../shared/fixtures/epub/structured.epub
          - $(SRCROOT)/../../shared/fixtures/epub/legacy.epub
          - $(SRCROOT)/../../shared/fixtures/epub/fixed-layout.epub
          - $(SRCROOT)/../../shared/fixtures/epub/encrypted.epub
          - $(SRCROOT)/../../shared/fixtures/epub/unsafe-entity.epub
          - $(SRCROOT)/../../shared/fixtures/epub/missing-spine.epub
          - $(SRCROOT)/../../shared/fixtures/epub/path-escape.epub
          - $(SRCROOT)/../../shared/fixtures/epub/image-only.epub
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests/StillTests
      - path: ../../shared/fixtures/catalog-gutendex.json
        buildPhase: resources
      - path: ../../shared/fixtures/catalog-opds.json
        buildPhase: resources
      - path: ../../shared/fixtures/catalog-atom.xml
        buildPhase: resources
      - path: ../../shared/fixtures/sample.epub
        buildPhase: resources
      - path: ../../shared/fixtures/epub
        type: folder
        buildPhase: resources
      - path: ../../shared/fixtures/outline.pdf
        buildPhase: resources
      - path: ../../shared/fixtures/no-outline.pdf
        buildPhase: resources
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/StillUITests]
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Still:
    build:
      targets:
        Still: all
    test:
      targets: [StillTests, StillUITests]
  StillMac:
    build:
      targets:
        StillMac: all
