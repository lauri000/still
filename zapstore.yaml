name: Still
summary: Offline PDF and EPUB reading with hold-to-read speed control.
description: |
  Import a PDF or EPUB, or discover and download public-domain books from
  Project Gutenberg. Read downloaded books offline with no account required.

  Hold the lower-right part of the screen to speed read. Slide right to read
  faster or left to slow down, from 60 to 900 words per minute. Release to
  pause. Enlarge the active word, enable Focus letter, and choose natural
  pauses or animated word transitions.

  Switch to passage view to scroll through the text, then tap a word to
  continue in single-line view. Navigate by chapter or book progress, and
  read in portrait or landscape. Your place is saved when you pause or leave.

  Edit extracted text, choose a starting point, and export or restore portable
  book backups. Books, original files, and reading progress stay on your device.
  Discovery and downloads need an internet connection.
