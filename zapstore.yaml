name: Still
summary: Read your PDFs one word at a time, at your own pace.
description: |
  Still is a quiet, offline PDF speed reader.

  Import a PDF, choose where to begin, and hold the bottom-right corner to read.
  Release to pause. While holding, move right to increase the current speed or
  left to decrease it, without a play button or slider.

  The current word stays centered with surrounding words visible. Switch between
  a single line and a passage of rows that move around the active word. One reading
  view is shown at a time, including a compact layout for phone landscape screens.
  Passage mode uses equal-sized words, with a darker active word, muted surrounding
  text, and justified rows. The single-line view keeps its larger active word.
  Swipe the text backward or forward, or tap a nearby word, then hold the corner
  to resume. Text navigation stays separate from the corner's speed gesture.

  - Adjustable speed from 60 to 900 words per minute, with optional natural pauses.
  - Optional centered, highlighted focus letter.
  - Saved reading progress, page boundaries, and PDF bookmark chapters.
  - Optional text corrections and a reversible starting-page or starting-word trim.
  - Portable book backups compatible with Still for iPad and macOS.
  - No account, network permission, or server dependency.

  Requires Android 9 or newer. Designed for PDFs with selectable text;
  scanned PDFs need manually entered text. OCR and automatic sync are not included.
license: MIT
